        function generateCredits(text) {
            const blocks = text.trim().split(/\n\s*\n/);
			
			// Если включен рандом, перемешиваем блоки алгоритмом Фишера-Йетса
            if (SHUFFLE_CREDITS) {
                for (let i = blocks.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
                }
            }
			
            let html = '';

            blocks.forEach(block => {
                const lines = block.split('\n').map(line => line.trim()).filter(line => line);
                if (lines.length > 0) {
                    html += `<h2>${lines[0]}</h2>\n`; 
                    for (let i = 1; i < lines.length; i++) {
                        // Если строка начинается с http или https — делаем картинку
                        if (lines[i].startsWith('http://') || lines[i].startsWith('https://')) {
                            // onerror спрячет картинку, если ссылка окажется нерабочей
                            html += `<img src="${lines[i]}" alt="Фото" onerror="this.style.display='none'">\n`;
                        } else {
                            html += `<p>${lines[i]}</p>\n`; 
                        }
                    }
                }
            });

            return `<div class="credits-content">\n${html}</div>`;
        }
